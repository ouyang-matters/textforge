[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "textforge"
version = "0.1.0"
description = "Text post-processing middleware with rewrite, validation, provenance, and watermark benchmarking."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "httpx>=0.27.0",
    "anthropic>=0.49.0",
    "sqlalchemy>=2.0.30",
    "aiosqlite>=0.20.0",
    "click>=8.1.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.1.0",
    "python-Levenshtein>=0.25.0",
]

[project.optional-dependencies]
synthid = ["synthid-text>=0.1.0"]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "httpx>=0.27.0",
]

[project.scripts]
textforge = "textforge.cli:main"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["UP042"]

[tool.ruff.lint.per-file-ignores]
"textforge/rewrite/prompts.py" = ["E501"]
"textforge/rewrite/protected_spans.py" = ["E501"]
"textforge/rewrite/planner.py" = ["E501"]
"textforge/provenance/models.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires real API keys",
]
